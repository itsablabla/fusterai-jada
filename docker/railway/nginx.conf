user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 30M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss image/svg+xml;

    access_log /dev/stdout;

    # Runtime PORT is templated in by entrypoint. Bind IPv4 AND IPv6 so Railway's
    # ingress mesh (IPv6 internal) can reach us on any interface.
    server {
        listen 0.0.0.0:__PORT__ default_server;
        listen [::]:__PORT__ default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Reverb WebSockets (Laravel Reverb runs on 127.0.0.1:8080 inside the container)
        location ~ ^/(app|apps)(/|$) {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known) { deny all; }
    }
}
